version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dclaw_cost
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dclaw_cost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dclaw_cost
      APP_ENV: production
    ports:
      - "8122:8122"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8122/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      PORT: 3036
      # Server-side rewrite proxy — the backend URL is never exposed to the browser.
      # For Vercel, set BACKEND_URL in Project Settings → Environment Variables.
      BACKEND_URL: http://backend:8122
    ports:
      - "3036:3036"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3036/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
